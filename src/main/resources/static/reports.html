<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Insurance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .container {
            display: none;
        }
        body.authenticated .container {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Insurance Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="policyholders.html">Policyholders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="policies.html">Policies</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="reports.html">Reports</a>
                    </li>
                </ul>
              
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4" id="main-content">
        <div class="row">
            <div class="col-md-12">
                <h2>Reports Dashboard</h2>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Policyholder Analytics</h5>
                                <button class="btn btn-primary" id="btn-policyholder-analytics">
                                    <i class="fas fa-chart-line"></i> View Analytics
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Policy Analytics</h5>
                                <button class="btn btn-primary" id="btn-policy-performance">
                                    <i class="fas fa-chart-bar"></i> View Analytics
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Financial Analytics</h5>
                                <button class="btn btn-primary" id="btn-financial-reports">
                                    <i class="fas fa-file-invoice-dollar"></i> View Analytics
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

             

                <!-- Analytics Section -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">Analytics Overview</h5>
                    </div>
                    <div class="card-body">
                        <div id="analytics-controls" class="mb-3" style="display:none;">
                            <button class="btn btn-sm btn-primary me-2" id="btn-edit-analytics"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn btn-sm btn-secondary me-2" id="btn-clear-analytics"><i class="fas fa-eraser"></i> Clear</button>
                            <input type="text" id="search-analytics-id" class="form-control d-inline-block w-auto me-2" placeholder="Search by ID">
                            <button class="btn btn-sm btn-info" id="btn-search-analytics"><i class="fas fa-search"></i> Search</button>
                        </div>
                        <!-- Analytics Filters -->
                        <div id="analytics-filters" class="mb-3">
                            <div class="row">
                                <div class="col">
                                    <input type="date" id="analytics-start-date" class="form-control" placeholder="Start Date">
                                </div>
                                <div class="col">
                                    <input type="date" id="analytics-end-date" class="form-control" placeholder="End Date">
                                </div>
                                <div class="col">
                                    <button class="btn btn-primary" id="analytics-filter-btn">Filter</button>
                                </div>
                            </div>
                        </div>
                        <div id="analytics-overview-content">
                            <!-- Policy  -->
                            <div id="policy-performance-stats" style="display: none;" class="row mb-4">
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Total Policies</h5>
                                            <p class="card-text fs-4" id="totalPolicies">0</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Active Policies</h5>
                                            <p class="card-text fs-4" id="activePolicies">0</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Pending Renewals</h5>
                                            <p class="card-text fs-4" id="pendingRenewals">0</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Expired Policies</h5>
                                            <p class="card-text fs-4" id="expiredPolicies">0</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Charts -->
                            <div class="row">
                                <div class="col-md-6">
                                    <canvas id="policyTypeChart"></canvas>
                                </div>
                                <div class="col-md-6">
                                    <canvas id="revenueChart"></canvas>
                                </div>
                            </div>
                            <div class="row mt-4">
                                <div class="col-md-6">
                                    <canvas id="policyholderGrowthChart"></canvas>
                                </div>
                                <div class="col-md-6">
                                    <canvas id="claimsChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const agent = localStorage.getItem('agent');
    
            if (!token || isLoggedIn !== 'true' || !agent) {
                localStorage.removeItem('token');
                localStorage.removeItem('agent');
                localStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html';
            } else {
                document.body.classList.add('authenticated');
            }
        });
    </script>
    
</body>
</html>

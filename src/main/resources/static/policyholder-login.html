<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policyholder Login - Insurance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Insurance Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="policyholder-login.html">Policyholder Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Error notification -->
                <div id="error-notification" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                    <strong><i class="fas fa-exclamation-circle"></i> Error:</strong> <span id="error-message">Invalid credentials</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <!-- Success notification -->
                <div id="success-notification" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                    <strong><i class="fas fa-check-circle"></i> Success:</strong> <span id="success-message">Login successful</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <!-- Login Card -->
                <div class="card shadow" id="login-card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Policyholder Login</h4>
                    </div>
                    <div class="card-body">
                        <form id="policyholder-login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p>Don't have an account? <a href="#" id="showPolicyholderRegister">Register as Policyholder</a></p>
                            <p>Are you an agent? <a href="index.html">Login as Agent</a></p>
                        </div>
                    </div>
                </div>
                
                <!-- Registration Card (Hidden by default) -->
                <div class="card shadow" id="register-card" style="display: none;">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Policyholder Registration</h4>
                    </div>
                    <div class="card-body">
                        <form id="policyholder-register-form">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="register-firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="register-firstName" name="firstName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="register-lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="register-lastName" name="lastName" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="register-email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="register-email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="register-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="register-password" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="register-phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="register-phone" name="phoneNumber">
                            </div>
                            <div class="mb-3">
                                <label for="register-gender" class="form-label">Gender</label>
                                <select class="form-select" id="register-gender" name="gender">
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="register-birthdate" class="form-label">Birthdate</label>
                                <input type="date" class="form-control" id="register-birthdate" name="birthdate">
                            </div>
                            <div class="mb-3">
                                <label for="register-street" class="form-label">Street Address</label>
                                <input type="text" class="form-control" id="register-street" name="street">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="register-city" class="form-label">City</label>
                                    <input type="text" class="form-control" id="register-city" name="city">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="register-state" class="form-label">State</label>
                                    <input type="text" class="form-control" id="register-state" name="state">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="register-zipCode" class="form-label">Zip Code</label>
                                    <input type="text" class="form-control" id="register-zipCode" name="zipCode">
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Register</button>
                                <button type="button" class="btn btn-secondary" id="showLogin">Back to Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/policyholder.js"></script>
</body>
</html>

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/insurance_company_database}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security Configuration
spring.security.filter.dispatcher-types=REQUEST,ASYNC,FORWARD

server.port=${PORT:8080}

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.insurance=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-here-make-it-very-long-and-secure}
jwt.expiration=${JWT_EXPIRATION:216000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# JPA/Hibernate Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# MySQL Specific Settings
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.current_session_context_class=thread

# Schema Validation
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.action=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.create-target=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.drop-target=none
